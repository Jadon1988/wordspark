<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="description" content="WordSpark — Learn English vocabulary with games, streaks and AI coaching" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WordSpark ⚡</title>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1e1b4b; }
    #root { height: 100%; min-height: 100vh; }

    #ws-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #1e1b4b, #3730a3, #312e81);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      transition: opacity 0.4s ease;
    }
    #ws-loading.fade-out { opacity: 0; pointer-events: none; }
    .ws-logo { font-size: 56px; animation: wsPulse 1.4s ease-in-out infinite; }
    .ws-name { font-size: 28px; font-weight: 900; margin-top: 16px; letter-spacing: -0.5px; }
    .ws-sub  { font-size: 14px; margin-top: 8px; opacity: 0.55; }
    @keyframes wsPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.12); }
    }
  </style>

  <!-- localStorage polyfill for window.storage API -->
  <script>
    window.storage = {
      get: async function(key) {
        var val = localStorage.getItem(key);
        if (val === null) throw new Error('Key not found: ' + key);
        return { key: key, value: val };
      },
      set: async function(key, value) {
        localStorage.setItem(key, String(value));
        return { key: key, value: value };
      },
      delete: async function(key) {
        localStorage.removeItem(key);
        return { key: key, deleted: true };
      },
      list: async function(prefix) {
        var keys = Object.keys(localStorage);
        if (prefix) keys = keys.filter(function(k){ return k.indexOf(prefix) === 0; });
        return { keys: keys };
      }
    };
  </script>
</head>
<body>

  <div id="ws-loading">
    <div class="ws-logo">⚡</div>
    <div class="ws-name">WordSpark</div>
    <div class="ws-sub">Loading your English journey…</div>
  </div>

  <div id="root"></div>

  <!-- React 18 + ReactDOM (UMD production builds — no build step needed) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Pre-built app — no Babel needed, runs instantly -->
  <script src="app.js"></script>

  <!-- Hide loading screen once React mounts -->
  <script>
    var observer = new MutationObserver(function() {
      if (document.getElementById('root').children.length > 0) {
        var loader = document.getElementById('ws-loading');
        loader.classList.add('fade-out');
        setTimeout(function(){ loader.style.display = 'none'; }, 420);
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  </script>

</body>
</html>
