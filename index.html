<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#6D40F0">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="description" content="WordSpark — Learn English vocabulary with games, streaks and AI coaching" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <title>WordSpark ⚡</title>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #1e1b4b;
    }
    #root { height: 100%; }

    /* Desktop: centered phone card */
    @media (min-width: 600px) {
      html, body {
        height: auto;
        min-height: 100%;
        background: #0d0b24;
        overflow-y: auto;
      }
      body {
        display: flex;
        justify-content: center;
        padding: 32px 20px 48px;
      }
      #root {
        width: 400px;
        min-width: 360px;
        height: auto;
        min-height: calc(100vh - 80px);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
        flex-shrink: 0;
      }
    }

    /* Loading screen */
    #ws-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #1e1b4b, #3730a3, #312e81);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      transition: opacity 0.4s ease;
    }
    #ws-loading.fade-out { opacity: 0; pointer-events: none; }
    .ws-logo { font-size: 56px; animation: wsPulse 1.4s ease-in-out infinite; }
    .ws-name { font-size: 28px; font-weight: 900; margin-top: 16px; letter-spacing: -0.5px; }
    .ws-sub  { font-size: 14px; margin-top: 8px; opacity: 0.55; }
    @keyframes wsPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.12); }
    }
  </style>

  <!-- window.storage API — maps to localStorage for persistence -->
  <script>
    window.storage = {
      get: async function(key) {
        var val = localStorage.getItem(key);
        if (val === null) throw new Error('Key not found: ' + key);
        return { key: key, value: val };
      },
      set: async function(key, value) {
        localStorage.setItem(key, String(value));
        return { key: key, value: value };
      },
      delete: async function(key) {
        localStorage.removeItem(key);
        return { key: key, deleted: true };
      },
      list: async function(prefix) {
        var keys = Object.keys(localStorage);
        if (prefix) keys = keys.filter(function(k){ return k.indexOf(prefix) === 0; });
        return { keys: keys };
      }
    };
  </script>
</head>
<body>

  <div id="ws-loading">
    <div class="ws-logo">⚡</div>
    <div class="ws-name">WordSpark</div>
    <div class="ws-sub">Loading your English journey…</div>
  </div>

  <div id="root"></div>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- App -->
  <script src="app.js"></script>

  <!-- Hide loading screen once React has mounted -->
  <script>
    var _obs = new MutationObserver(function() {
      if (document.getElementById('root').children.length > 0) {
        var loader = document.getElementById('ws-loading');
        loader.classList.add('fade-out');
        setTimeout(function(){ loader.style.display = 'none'; }, 420);
        _obs.disconnect();
      }
    });
    _obs.observe(document.getElementById('root'), { childList: true, subtree: true });
  </script>
<script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("service-worker.js").catch(function () {});
        });
      }
    </script>
</body>
</html>
